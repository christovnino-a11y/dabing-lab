# Vlastní CODEX_HOME Dabing labu.
#
# Nedědí ~/.codex: žádné hooky, skills, MCP servery ani AGENTS.md (pokyn číst
# Obsidian vault by zdržoval a zbytečně nafukoval každý turn).
# auth.json vzniká přihlášením v labu (sekce „Codex účet", předplatné ChatGPT, žádný API klíč);
# u vlastníka repozitáře je to symlink na ~/.codex/auth.json. Do gitu nejde (.gitignore).
#
# Model a effort se dají přebít při thread/start; tady jsou výchozí hodnoty.

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_verbosity = "low"
sandbox_mode = "read-only"
approval_policy = "never"
# Vyhledávání na webu: ověření jmen, produktů a cen v přepisu před překladem
# (translate._over_jmena). Ven jdou jen dotazy, které Codex sám položí; zvuk nikdy.
web_search = "live"
